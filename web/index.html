<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Without this meta, mobile browsers render a shrunk desktop page
       and the keyboard overlays the Mirror input — typing went blind.
       resizes-content: the keyboard folds the layout, Flutter adapts. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KENOS — l'anti-réseau social. Lance une pensée intime dans l'éther : une seule personne pourra la lire, puis elle s'autodétruira.">
  <meta name="theme-color" content="#030508">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KENOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KENOS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The canvas owns the whole viewport; the document never scrolls.
       Browser-level scrolling (the keyboard's scroll-into-view on
       desktop web) used to drift the viewport and made bottom taps
       unreliable — the v3.10b remainder, closed here. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* First paint is BRANDed, not blank: the wordmark breathes on the
       void while the engine downloads, then fades on the first frame. */
    @keyframes kenos-breathe { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
  </style>
</head>
<body>
  <!-- Branded splash: covers the CanvasKit download window so the very
       first pixels belong to the sanctuary, not to a white page. -->
  <div id="kenos-splash" aria-hidden="true"
       style="position:fixed; inset:0; z-index:9000; background:#030508;
              display:flex; align-items:center; justify-content:center;
              transition:opacity 600ms ease;">
    <div style="color:#14b8a6; font-family:'Courier New',monospace;
                font-size:13px; letter-spacing:8px;
                animation:kenos-breathe 3.2s ease-in-out infinite;">
      K&nbsp;E&nbsp;N&nbsp;O&nbsp;S
    </div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('kenos-splash');
      function fade() {
        if (!splash) return;
        splash.style.opacity = '0';
        setTimeout(function () { if (splash) splash.remove(); }, 650);
      }
      window.addEventListener('flutter-first-frame', fade, { once: true });
      // Safety net: if the first-frame event never comes, the first
      // touch still clears the way.
      window.addEventListener('pointerdown', fade, { once: true });
    })();
  </script>
  <!-- KENOS install invitation: browsers rarely surface the PWA prompt
       (Chrome shows its banner once; iOS Safari never does). We offer
       it ourselves — beforeinstallprompt where it exists, the honest
       iOS path (Partager → Sur l'écran d'accueil) where it doesn't.
       Dismissed once, remembered in localStorage. -->
  <div id="kenos-install" style="display:none; position:fixed; left:0; right:0; bottom:0; z-index:9999; padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:#030508f2; border-top:1px solid #1ffffff; font-family:'Courier New',monospace;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="flex:1; color:#f4f4f6cc; font-size:11px; letter-spacing:1px; line-height:1.5;">
        KENOS peut vivre sur ton écran.<br>
        <span id="kenos-install-hint" style="color:#14b8a6b3; font-size:9px;"></span>
      </div>
      <button id="kenos-install-go" style="background:none; border:1px solid #14b8a6; color:#14b8a6; font-family:inherit; font-size:10px; letter-spacing:2px; padding:9px 14px; border-radius:6px; cursor:pointer;">INSTALLER</button>
      <button id="kenos-install-no" aria-label="Fermer" style="background:none; border:none; color:#f4f4f666; font-size:14px; cursor:pointer; padding:6px;">✕</button>
    </div>
  </div>
  <script>
    (function () {
      if (localStorage.getItem('kenos.install.dismissed') === '1') return;
      var bar = document.getElementById('kenos-install');
      var hint = document.getElementById('kenos-install-hint');
      var go = document.getElementById('kenos-install-go');
      var deferred = null;

      function show() { setTimeout(function () { bar.style.display = 'block'; }, 2500); }
      function dismiss() { bar.style.display = 'none'; localStorage.setItem('kenos.install.dismissed', '1'); }
      document.getElementById('kenos-install-no').addEventListener('click', dismiss);

      var ua = navigator.userAgent.toLowerCase();
      var isIOS = /iphone|ipad|ipod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        if (!window.matchMedia('(display-mode: standalone)').matches && !navigator.standalone) {
          hint.textContent = 'iPHONE : PARTAGER → « SUR L\'ÉCRAN D\'ACCUEIL »';
          go.textContent = 'COMPRIS';
          go.addEventListener('click', dismiss);
          show();
        }
        return;
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        hint.textContent = 'HORS LIGNE, PLEIN ÉCRAN, SANS NAVIGATEUR';
        go.addEventListener('click', function () {
          if (deferred) { deferred.prompt(); dismiss(); }
        });
        show();
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
