  <style>
    /* The canvas owns the whole viewport; the document never scrolls.
       Browser-level scrolling (the keyboard's scroll-into-view on
       desktop web) used to drift the viewport and made bottom taps
       unreliable — the v3.10b remainder, closed here. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* First paint is BRANDed, not blank: the wordmark breathes on the
       void while the engine downloads, then fades on the first frame. */
    @keyframes kenos-breathe { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
  </style>
</head>
<body>
  <!-- Branded splash: covers the CanvasKit download window so the very
       first pixels belong to the sanctuary, not to a white page. -->
  <div id="kenos-splash" aria-hidden="true"
       style="position:fixed; inset:0; z-index:9000; background:#030508;
              display:flex; align-items:center; justify-content:center;
              transition:opacity 600ms ease;">
    <div style="color:#14b8a6; font-family:'Courier New',monospace;
                font-size:13px; letter-spacing:8px;
                animation:kenos-breathe 3.2s ease-in-out infinite;">
      K&nbsp;E&nbsp;N&nbsp;O&nbsp;S
    </div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('kenos-splash');
      function fade() {
        if (!splash) return;
        splash.style.opacity = '0';
        setTimeout(function () { if (splash) splash.remove(); }, 650);
      }
      window.addEventListener('flutter-first-frame', fade, { once: true });
      // Safety net: if the first-frame event never comes, the first
      // touch still clears the way.
      window.addEventListener('pointerdown', fade, { once: true });
    })();
  </script>
  <!-- KENOS install invitation: browsers rarely surface the PWA prompt
       (Chrome shows its banner twice, then NEVER fires the event again;
       iOS Safari never does). V3.65 — the bar is AUTONOMOUS: it no
       longer waits for beforeinstallprompt. If the browser offers the
       event, INSTALLER triggers it; if it doesn't (the common case on
       a tablet that once shrugged), the bar still shows the honest
       manual path (⋮ menu / Partager). Dismissed once, remembered in
       localStorage (key v2: the re-offer must reach devices silenced
       by the old event-only logic). -->
  <div id="kenos-install" style="display:none; position:fixed; left:0; right:0; bottom:0; z-index:9999; padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:#030508f2; border-top:1px solid #ffffff1f; font-family:'Courier New',monospace;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="flex:1; color:#f4f4f6cc; font-size:11px; letter-spacing:1px; line-height:1.5;">
        KENOS peut vivre sur ton écran.<br>
        <span id="kenos-install-hint" style="color:#14b8a6b3; font-size:9px;"></span>
      </div>
      <button id="kenos-install-go" style="background:none; border:1px solid #14b8a6; color:#14b8a6; font-family:inherit; font-size:10px; letter-spacing:2px; padding:9px 14px; border-radius:6px; cursor:pointer;">INSTALLER</button>
      <button id="kenos-install-no" aria-label="Fermer" style="background:none; border:none; color:#f4f4f666; font-size:14px; cursor:pointer; padding:6px;">✕</button>
    </div>
  </div>
  <script>
    (function () {
      if (localStorage.getItem('kenos.install.dismissed.v2') === '1') return;
      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (standalone) return;
      var bar = document.getElementById('kenos-install');
      var hint = document.getElementById('kenos-install-hint');
      var go = document.getElementById('kenos-install-go');
      var deferred = null;

      function show() { setTimeout(function () { bar.style.display = 'block'; }, 2500); }
      function dismiss() { bar.style.display = 'none'; localStorage.setItem('kenos.install.dismissed.v2', '1'); }
      document.getElementById('kenos-install-no').addEventListener('click', dismiss);

      var ua = navigator.userAgent.toLowerCase();
      var isIOS = /iphone|ipad|ipod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        hint.textContent = 'iPHONE / iPAD : PARTAGER → « SUR L\'ÉCRAN D\'ACCUEIL »';
        go.textContent = 'COMPRIS';
        go.addEventListener('click', dismiss);
        show();
        return;
      }

      // Preferred path: the browser hands us the prompt.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        hint.textContent = 'HORS LIGNE, PLEIN ÉCRAN, SANS NAVIGATEUR';
      });
      go.addEventListener('click', function () {
        if (deferred) deferred.prompt();
        dismiss();
      });

      // The quota is burned on most tablets (the banner was shrugged
      // at twice) — the event never fires again. Offer the manual
      // path anyway: Chrome's ⋮ menu always carries the door.
      setTimeout(function () {
        if (!deferred) {
          hint.textContent = 'MENU ⋮ → « INSTALLER L\'APPLICATION »';
          go.textContent = 'COMPRIS';
        }
        show();
      }, 6000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- KENOS ether-refresh whisper (V3.44): the service worker serves
       the LAST INSTALLED bundle until every tab of the origin closes —
       a deployed fix looks "not deployed" in any long-lived tab (this
       exact confusion judged two deploys wrong today). When a NEWER
       worker waits behind the controller, a quiet bar offers
       RECHARGER: the reload is cache-busted, so the very next frame
       is the new sky. Checked on load, on focus, once a minute. -->
  <div id="kenos-fresh" style="display:none; position:fixed; left:0; right:0; bottom:0; z-index:9998; padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:#030508f2; border-top:1px solid #14b8a666; font-family:'Courier New',monospace;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="flex:1; color:#f4f4f6cc; font-size:11px; letter-spacing:1px;">
        L'ÉTHER S'EST RAFRAÎCHI.<br>
        <span style="color:#14b8a6b3; font-size:9px;">RECHARGER POUR LE VIVRE.</span>
      </div>
      <button id="kenos-fresh-go" style="background:none; border:1px solid #14b8a6; color:#14b8a6; font-family:inherit; font-size:10px; letter-spacing:2px; padding:9px 14px; border-radius:6px; cursor:pointer;">RECHARGER</button>
      <button id="kenos-fresh-no" aria-label="Fermer" style="background:none; border:none; color:#f4f4f666; font-size:14px; cursor:pointer; padding:6px;">✕</button>
    </div>
  </div>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var bar = document.getElementById('kenos-fresh');
      function check() {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (!reg) return;
          // Ask the browser to look for a newer worker NOW (it only
          // re-checks on its own every ~24h)…
          if (reg.update) reg.update().catch(function () {});
          // …and speak when one already waits behind the controller.
          if (reg.waiting && navigator.serviceWorker.controller) {
            bar.style.display = 'block';
          }
        }).catch(function () {});
      }
      document.getElementById('kenos-fresh-no').addEventListener('click', function () {
        bar.style.display = 'none';
      });
      document.getElementById('kenos-fresh-go').addEventListener('click', function () {
        // Cache-busted reload: the query makes the URL miss the old
        // worker's cache, so the next frame is the new sky — whatever
        // the worker's activation state.
        location.href = location.pathname + '?fresh=' + Date.now();
      });
      window.addEventListener('load', function () { setTimeout(check, 4000); });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) check();
      });
      setInterval(check, 60000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
