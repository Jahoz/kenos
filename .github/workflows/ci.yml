name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-web:
    name: build web (compiles the shader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Fragment shaders are compiled at build time: a GLSL error in
      # ether_dissolve.frag fails here, never on a device.
      - run: flutter build web --release

  sql:
    name: migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-supabase@v1
        with:
          version: latest
      # The job that would have caught the pgcrypto search_path bug
      # before it shipped: apply every migration to a clean local
      # stack, then run the full pgTAP suite (48 invariants).
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: bash -n scripts/e2e_local.sh
