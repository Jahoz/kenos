name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned to the version the project is developed against; upgrade
  # deliberately, not by runner drift.
  FLUTTER_VERSION: 3.41.6

jobs:
  flutter:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-web:
    name: build web (compiles the shader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Fragment shaders are compiled at build time: a GLSL error in
      # ether_dissolve.frag fails here, never on a device.
      - run: flutter build web --release

  sql:
    name: migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # There is no official setup action; the CLI ships on npm.
      - run: sudo npm install -g supabase
      # The job that would have caught the pgcrypto search_path bug
      # before it shipped: apply every migration to a clean local
      # stack, then run the full pgTAP suite (48 invariants).
      - run: supabase start
      - run: supabase db reset
      # F-15 — schema drift guard: the reset only proves migrations
      # apply; this proves the resulting schema still matches what the
      # client references (RPCs from lib/), that kenos_purge kept every
      # retention rule (two migrations once overwrote each other by
      # lexicographic order), and that every table keeps RLS.
      - run: bash scripts/check-schema-drift.sh
      - run: supabase test db
      # PWW-04 — la boucle e2e tourne pour de vrai. Avant, cette étape
      # n'était qu'un « bash -n » (contrôle SYNTAXIQUE) : la régression
      # V3.11a — constellations vides en prod, CI verte — a été attrapée
      # par un œil humain, pas par elle. Le script s'exécute ICI, dans
      # le job qui a déjà la stack debout (mêmes ports, aucune
      # collision), après pgTAP : les tests pg_prove passent chacun en
      # transaction annulée, la base est propre quand la boucle commence.
      # Si la stack ne rend pas son URL, on SAUTE avec la raison
      # affichée — jamais un bash -n à la place du vrai run.
      - name: e2e (réel) — boucle bouteille-en-mer sur la stack debout
        run: |
          API_URL="$(supabase status -o json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("API_URL",""))' || true)"
          if [ -z "$API_URL" ]; then
            echo "::warning title=e2e sauté::e2e SKIPPÉ — la stack locale ne rend pas son URL (supabase status muet). Raison affichée ici ; jamais de bash -n en remplacement."
            exit 0
          fi
          echo "e2e réel contre $API_URL"
          bash scripts/e2e_local.sh
