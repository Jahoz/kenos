name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned to the version the project is developed against; upgrade
  # deliberately, not by runner drift.
  FLUTTER_VERSION: 3.41.6

jobs:
  flutter:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-web:
    name: build web (compiles the shader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Fragment shaders are compiled at build time: a GLSL error in
      # ether_dissolve.frag fails here, never on a device.
      - run: flutter build web --release

  sql:
    name: migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # There is no official setup action; the CLI ships on npm.
      - run: sudo npm install -g supabase
      # The job that would have caught the pgcrypto search_path bug
      # before it shipped: apply every migration to a clean local
      # stack, then run the full pgTAP suite (48 invariants).
      - run: supabase start
      - run: supabase db reset
      # F-15 — schema drift guard: the reset only proves migrations
      # apply; this proves the resulting schema still matches what the
      # client references (RPCs from lib/), that kenos_purge kept every
      # retention rule (two migrations once overwrote each other by
      # lexicographic order), and that every table keeps RLS.
      - run: bash scripts/check-schema-drift.sh
      - run: supabase test db
      - run: bash -n scripts/e2e_local.sh
